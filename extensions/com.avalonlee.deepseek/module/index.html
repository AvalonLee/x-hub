<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek</title>
  <style>
    /* ---- 主题：双声明 fallback ---- */
    :root {
      color-scheme: light;
      --ink: var(--xhub-text-1, #1f2230);
      --ink-2: var(--xhub-text-2, #5b6070);
      --ink-3: var(--xhub-text-3, #8b90a2);
      --line: var(--xhub-border, rgba(0, 0, 0, 0.1));
      --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.9));
      --green: var(--xhub-green, #18a058);
    }
    :root[data-xhub-theme="dark"] {
      color-scheme: dark;
      --ink: var(--xhub-text-1, #e8e9f0);
      --ink-2: var(--xhub-text-2, #a2a7b8);
      --ink-3: var(--xhub-text-3, #7d8298);
      --line: var(--xhub-border, rgba(255, 255, 255, 0.12));
      --well: var(--xhub-bg-card, rgba(255, 255, 255, 0.04));
      --green: var(--xhub-green, #3fd18a);
    }

    /* module 卡片：宿主已套玻璃卡、**默认没有宿主表头**，卡面完全由本页负责（含小标题）。
       留白全由本页负责（宿主不给 iframe 加 padding）—— 12px 与内置模块卡一致。
       视口可能只有 ~86px 高，一律用 cqh/clamp 排版，不写死 min-height。 */
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: transparent;
      color: var(--ink);
      container-type: size;
      overflow: hidden;
    }

    .card {
      height: 100%;
      display: flex;
      align-items: center;
      gap: clamp(8px, 7cqh, 12px);
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .card:active { opacity: .75; }

    .logo { flex: none; width: clamp(22px, 34cqh, 34px); height: clamp(22px, 34cqh, 34px); }

    .text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .title {
      font-size: clamp(12px, 9cqh, 14px);
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sub {
      font-size: clamp(10px, 7cqh, 11.5px);
      line-height: 1.3;
      color: var(--ink-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 状态点：绿=窗口已打开，灰=未打开 */
    .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
    .dot.is-open { background: var(--green); }

    /* 壁纸透底态：文字加黑柔光晕（口径同宿主 .card） */
    :root[data-xhub-wallpaper-clear="1"] .title,
    :root[data-xhub-wallpaper-clear="1"] .sub { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
  </style>
</head>
<body>
  <div class="card" id="card" role="button" tabindex="0" aria-label="打开 DeepSeek">
    <img class="logo" src="../icon.svg" alt="" />
    <div class="text">
      <div class="title">DeepSeek</div>
      <div class="sub" id="sub">点击打开网页版</div>
    </div>
    <i class="dot" id="dot"></i>
  </div>

  <script>
    const SITE_URL = 'https://chat.deepseek.com/'
    const SITE_TITLE = 'DeepSeek'

    const $ = (id) => document.getElementById(id)
    const sub = $('sub')
    const dot = $('dot')
    const card = $('card')

    let bridgeReady = false
    let busy = false

    /** 把窗口状态画到卡面（`open` = 窗口当前是否可见） */
    function renderState(state) {
      const open = !!(state && state.open)
      dot.classList.toggle('is-open', open)
      if (!busy) sub.textContent = open ? '已打开 · 点击唤起窗口' : '点击打开网页版'
    }

    async function refreshState() {
      if (!bridgeReady) return
      try {
        renderState(await window.xhub.webview.state())
      } catch (_) { /* 状态读不到就保持上次文案，不打扰用户 */ }
    }

    async function openSite() {
      if (busy) return
      if (!bridgeReady) {
        sub.textContent = '当前 x-hub 版本不支持'
        return
      }
      busy = true
      sub.textContent = '正在打开…'
      try {
        // 重复 open 同一个地址不会重新加载（对话不丢），所以整卡点击是安全的
        renderState(await window.xhub.webview.open({ url: SITE_URL, title: SITE_TITLE }))
      } catch (e) {
        sub.textContent = (e && e.message) ? String(e.message).slice(0, 28) : '打开失败'
      } finally {
        busy = false
        // 让「正在打开…」至少停留一瞬，避免闪一下就回原文案
        setTimeout(() => { void refreshState() }, 400)
      }
    }

    card.addEventListener('click', openSite)
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSite() }
    })

    async function boot() {
      try {
        const info = await window.xhub.runtime.info()
        // 能力探测走运行期真实能力表，宿主没实现就优雅降级
        const caps = info.capabilities || []
        const declared = caps.some((c) => c.namespace === 'webview' && c.method === 'open')
        // 双保险：能力表说有 ≠ 桥脚本真封装了。宿主注册了能力却没在 window.xhub 上
        // 挂 webview 命名空间时，只查能力表会误判为就绪，随后 state() 直接 TypeError。
        bridgeReady = declared && !!(window.xhub && window.xhub.webview)
        if (!bridgeReady) {
          sub.textContent = '当前 x-hub 版本不支持'
          return
        }
      } catch (_) {
        sub.textContent = '未在 x-hub 内运行'
        return
      }
      await refreshState()
    }

    boot()
    // 工作台卡片常驻可见：窗口被用户从标题栏关掉后，卡面状态要跟上
    setInterval(() => {
      if (document.visibilityState === 'visible') void refreshState()
    }, 5000)
  </script>
</body>
</html>
